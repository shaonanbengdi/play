<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .countdown-display {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .time-unit {
            text-align: center;
        }
        .value {
            display: block;
            background: #0a1a3a;
            color: #ffd700;
            font-size: 2rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            min-width: 60px;
        }
        .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #0a1a3a;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #1a2a4a;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎯 倒计时功能测试</h1>
        
        <div class="countdown-display" id="countdown-display">
            <div class="time-unit">
                <span class="value" id="days">00</span>
                <span class="label">天</span>
            </div>
            <div class="time-unit">
                <span class="value" id="hours">00</span>
                <span class="label">小时</span>
            </div>
            <div class="time-unit">
                <span class="value" id="minutes">00</span>
                <span class="label">分钟</span>
            </div>
            <div class="time-unit">
                <span class="value" id="seconds">00</span>
                <span class="label">秒</span>
            </div>
        </div>

        <div class="debug-info" id="debug-info">等待测试...</div>

        <div style="text-align: center; margin-top: 20px;">
            <button onclick="runTest()">运行测试</button>
            <button onclick="clearTest()">清空</button>
            <button onclick="checkRealApp()">检查真实应用</button>
        </div>

        <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 4px;">
            <strong>测试说明：</strong><br>
            1. 点击"运行测试"查看当前时间与目标日期的计算<br>
            2. 检查格式化函数是否正常工作<br>
            3. 验证倒计时显示是否正确
        </div>
    </div>

    <script>
        // 格式化时间差函数（从utils.js复制）
        function formatTimeDifference(diffMs) {
            if (diffMs <= 0) {
                return { days: 0, hours: 0, minutes: 0, seconds: 0 };
            }

            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);

            return { days, hours, minutes, seconds };
        }

        // 更新显示
        function updateDisplay(time) {
            document.getElementById('days').textContent = String(time.days).padStart(2, '0');
            document.getElementById('hours').textContent = String(time.hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(time.minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(time.seconds).padStart(2, '0');
        }

        // 运行测试
        function runTest() {
            const debugInfo = document.getElementById('debug-info');
            
            // 当前时间
            const now = new Date();
            
            // 目标日期（从config.js复制）
            const targetDateStr = '2026-02-16T00:00:00';
            const targetDate = new Date(targetDateStr);
            
            // 计算时间差
            const diff = targetDate - now;
            
            // 格式化
            const formatted = formatTimeDifference(diff);
            
            // 构建输出
            let output = '';
            output += `🎯 倒计时测试结果\n`;
            output += `==================\n\n`;
            output += `当前时间: ${now.toLocaleString('zh-CN')}\n`;
            output += `目标时间: ${targetDate.toLocaleString('zh-CN')}\n`;
            output += `目标字符串: ${targetDateStr}\n\n`;
            output += `时间差计算:\n`;
            output += `  - 毫秒: ${diff}\n`;
            output += `  - 秒: ${(diff / 1000).toFixed(2)}\n`;
            output += `  - 分钟: ${(diff / (1000 * 60)).toFixed(2)}\n`;
            output += `  - 小时: ${(diff / (1000 * 60 * 60)).toFixed(2)}\n`;
            output += `  - 天: ${(diff / (1000 * 60 * 60 * 24)).toFixed(2)}\n\n`;
            output += `格式化结果:\n`;
            output += `  - 天: ${formatted.days}\n`;
            output += `  - 小时: ${formatted.hours}\n`;
            output += `  - 分钟: ${formatted.minutes}\n`;
            output += `  - 秒: ${formatted.seconds}\n\n`;
            output += `显示结果:\n`;
            
            // 更新显示
            updateDisplay(formatted);
            
            // 检查显示值
            const displayDays = document.getElementById('days').textContent;
            const displayHours = document.getElementById('hours').textContent;
            const displayMinutes = document.getElementById('minutes').textContent;
            const displaySeconds = document.getElementById('seconds').textContent;
            
            output += `  - 天: ${displayDays}\n`;
            output += `  - 小时: ${displayHours}\n`;
            output += `  - 分钟: ${displayMinutes}\n`;
            output += `  - 秒: ${displaySeconds}\n\n`;
            
            // 检查问题
            if (diff > 0 && (displayDays === '00' && displayHours === '00' && displayMinutes === '00' && displaySeconds === '00')) {
                output += `❌ 问题发现：时间差为正，但显示全为00\n`;
                output += `   可能原因：格式化函数或显示逻辑有问题\n`;
            } else if (diff <= 0) {
                output += `⚠️ 目标日期已过\n`;
            } else {
                output += `✅ 显示正常\n`;
            }
            
            debugInfo.textContent = output;
        }

        // 清空测试
        function clearTest() {
            document.getElementById('debug-info').textContent = '等待测试...';
            updateDisplay({ days: 0, hours: 0, minutes: 0, seconds: 0 });
        }

        // 检查真实应用
        function checkRealApp() {
            const debugInfo = document.getElementById('debug-info');
            
            // 检查真实应用的DOM元素
            const realCountdown = document.querySelector('.countdown-display');
            const realDays = document.getElementById('days');
            
            if (realCountdown && realDays) {
                // 尝试访问真实应用的全局变量
                if (window.newYearApp) {
                    const status = window.newYearApp.getStatus();
                    debugInfo.textContent = `真实应用状态:\n${JSON.stringify(status, null, 2)}`;
                } else {
                    debugInfo.textContent = `真实应用未找到 window.newYearApp\n请确保主应用已加载并运行。\n\n当前页面元素:\n- 倒计时容器: ${realCountdown ? '存在' : '缺失'}\n- 天数元素: ${realDays ? '存在' : '缺失'}\n- 当前显示值: ${realDays ? realDays.textContent : 'N/A'}`;
                }
            } else {
                debugInfo.textContent = `真实应用未在当前页面加载。\n请访问 http://localhost:8000 查看完整应用。`;
            }
        }
    </script>
</body>
</html>
