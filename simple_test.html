<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简单倒计时测试</title>
</head>
<body>
    <h1>简单倒计时测试</h1>
    <div id="result"></div>
    
    <script type="module">
        // 导入配置和模块
        import { CONFIG } from './js/config.js';
        import { CountdownTimer } from './js/modules/countdown.js';
        import { formatTimeDifference } from './js/modules/utils.js';
        
        const resultDiv = document.getElementById('result');
        
        // 测试配置
        resultDiv.innerHTML = `
            <h2>配置检查</h2>
            <p>目标日期配置: ${CONFIG.COUNTDOWN_TARGET}</p>
            <p>目标日期对象: ${new Date(CONFIG.COUNTDOWN_TARGET).toLocaleString('zh-CN')}</p>
            <p>当前时间: ${new Date().toLocaleString('zh-CN')}</p>
        `;
        
        // 测试倒计时器
        const elements = {
            root: { classList: { add: () => {}, remove: () => {} } },
            days: { textContent: '' },
            hours: { textContent: '' },
            minutes: { textContent: '' },
            seconds: { textContent: '' }
        };
        
        const timer = new CountdownTimer(CONFIG.COUNTDOWN_TARGET, elements);
        const time = timer.getTimeRemaining();
        
        resultDiv.innerHTML += `
            <h2>倒计时测试</h2>
            <p>时间差对象: ${JSON.stringify(time)}</p>
            <p>格式化显示: ${String(time.days).padStart(2, '0')}天 ${String(time.hours).padStart(2, '0')}小时 ${String(time.minutes).padStart(2, '0')}分钟 ${String(time.seconds).padStart(2, '0')}秒</p>
        `;
        
        // 测试格式化函数
        const now = new Date();
        const target = new Date(CONFIG.COUNTDOWN_TARGET);
        const diff = target - now;
        const formatted = formatTimeDifference(diff);
        
        resultDiv.innerHTML += `
            <h2>格式化函数测试</h2>
            <p>直接计算: ${JSON.stringify(formatted)}</p>
            <p>显示值: ${String(formatted.days).padStart(2, '0')}:${String(formatted.hours).padStart(2, '0')}:${String(formatted.minutes).padStart(2, '0')}:${String(formatted.seconds).padStart(2, '0')}</p>
        `;
        
        // 检查实际DOM元素
        const realDays = document.getElementById('days');
        const realHours = document.getElementById('hours');
        const realMinutes = document.getElementById('minutes');
        const realSeconds = document.getElementById('seconds');
        
        if (realDays) {
            resultDiv.innerHTML += `
                <h2>实际DOM检查</h2>
                <p>天数元素存在: 是</p>
                <p>当前显示值: ${realDays.textContent}:${realHours.textContent}:${realMinutes.textContent}:${realSeconds.textContent}</p>
            `;
        } else {
            resultDiv.innerHTML += `
                <h2>实际DOM检查</h2>
                <p>天数元素存在: 否 (这是测试页面，没有主应用的DOM)</p>
            `;
        }
    </script>
</body>
</html>
